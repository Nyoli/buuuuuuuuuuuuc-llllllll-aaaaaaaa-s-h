allow-lan: true
external-controller: "0.0.0.0:9090"

port: 7892
socks-port: 7891
mixed-port: 7890
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 15

# --- 存储与控制 ---
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain: ["+.push.apple.com"]

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
  device: Mihomo0
  mtu: 1500

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.localhost"
    - "+.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ntp.org"
    - "router.asus.com"
    - "tplogin.cn"
    - "+.direct"
    - "+.music.163.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "your_domain_name":
      - https://223.5.5.5/dns-query
  respect-rules: true
  prefer-h3: false

proxies:
  - name: "Moe-Vless"
    type: vless
    server: your_ip
    port: your_port
    flow: xtls-rprx-vision
    uuid: your_uuid
    udp: true
    tls: true
    network: tcp
    servername: your_servername
    reality-opts:
      public-key: your_public-key
      short-id: your_short-id
    client-fingerprint: firefox

  - name: "Moe-Tuic"
    server: your_domain_name
    sni: your_domain_name
    type: tuic
    port: your_port
    uuid: your_uuid
    password: your_password
    alpn: [h3]
    disable-sni: false
    skip-cert-verify: false
    congestion-controller: bbr
    udp-relay-mode: native
    # reduce-rtt: true

  - name: "Moe-Anytls"
    type: anytls
    server: your_domain_name
    sni: your_domain_name
    port: your_port
    password: your_password
    skip-cert-verify: false
    udp: true
    idle-session-check-interval: 30
    idle-session-timeout: 30
    client-fingerprint: firefox

  - name: "Moe-Hy2"
    type: hysteria2
    server: your_domain_name
    port: your_port
    ports: your_port-your_port
    password: your_password
    alpn:
      - h3
    sni: your_domain_name
    skip-cert-verify: false
    fast-open: true

  - name: "Moe-Vmess"
    type: vmess
    server: your_domain_name
    port: your_port
    uuid: your_uuid
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    network: ws
    servername: your_domain_name
    ws-opts:
      path: "your_path"
      headers:
        Host: your_domain_name

proxy-groups:
  - name: 主代理
    type: select
    proxies:
      [自动选择, Moe-Vless, Moe-Tuic, Moe-Anytls, Moe-Hy2, Moe-Vmess, DIRECT]

  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies: [Moe-Anytls, Moe-Tuic, Moe-Vless, Moe-Hy2, Moe-Vmess]

  - name: Google
    type: select
    proxies: [主代理, Moe-Anytls, Moe-Tuic, Moe-Vless, Moe-Hy2, Moe-Vmess]

  - name: Telegram
    type: select
    proxies: [主代理, Moe-Anytls, Moe-Tuic, Moe-Vless, Moe-Hy2, Moe-Vmess]

  - name: OpenAI
    type: select
    proxies: [主代理, Moe-Anytls, Moe-Tuic, Moe-Vless, Moe-Hy2, Moe-Vmess]

  - name: Bilibili
    type: select
    proxies: [DIRECT, 主代理]

  - name: Apple
    type: select
    proxies: [DIRECT, 主代理]

  - name: Microsoft
    type: select
    proxies: [主代理, DIRECT]

  - name: 中国大陆网站
    type: select
    proxies: [DIRECT, 主代理]

  - name: 黑名单网站
    type: select
    proxies: [主代理]

  - name: Bahamut
    type: select
    proxies: [主代理]

  - name: Discord
    type: select
    proxies: [主代理]

  - name: Netflix
    type: select
    proxies: [主代理]

  - name: Speedtest
    type: select
    proxies: [主代理]

  - name: Spotify
    type: select
    proxies: [主代理]

  - name: Steam
    type: select
    proxies: [主代理, DIRECT]

  - name: TikTok
    type: select
    proxies: [主代理]

  - name: GoogleFCM
    type: select
    proxies: [主代理, DIRECT]

rule-providers:
  China-Site:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/China/China-Site.mrs"
    path: ./ruleset/China-Site.mrs
    interval: 86400
    proxy: 主代理

  China-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/China/China-IP.mrs"
    path: ./ruleset/China-IP.mrs
    interval: 86400
    proxy: 主代理

  GFWList-Site:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/GFWList/GFWList-Site.mrs"
    path: ./ruleset/GFWList-Site.mrs
    interval: 86400
    proxy: 主代理

  Google-Site:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Google/Google-Site.mrs"
    path: ./ruleset/Google-Site.mrs
    interval: 86400
    proxy: 主代理

  Local-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Local/Local-IP.mrs"
    path: ./ruleset/Local-IP.mrs
    interval: 86400
    proxy: 主代理

rules:
  - "AND,((DST-PORT,443),(NETWORK,UDP)),REJECT"
  - "DOMAIN-KEYWORD,googleapis,Google"
  - "RULE-SET,Google-Site,Google"
  - "RULE-SET,GFWList-Site,黑名单网站"
  - "RULE-SET,China-Site,中国大陆网站"
  - "RULE-SET,Local-IP,DIRECT,no-resolve"
  - "RULE-SET,China-IP,中国大陆网站,no-resolve"
  - "GEOIP,CN,中国大陆网站,no-resolve"
  - "MATCH,主代理"
